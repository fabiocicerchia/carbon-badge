[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-badge"
version = "0.6.1"
description = "Shields-style README badge for a repo's CI carbon footprint"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Fabio Cicerchia" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/fabiocicerchia/carbon-badge"
Issues = "https://github.com/fabiocicerchia/carbon-badge/issues"
Changelog = "https://github.com/fabiocicerchia/carbon-badge/blob/main/CHANGELOG.md"

[project.scripts]
carbon-badge = "carbon_badge:main"

[tool.setuptools]
py-modules = ["carbon_badge"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
# Without this pytest imports an installed carbon_badge from site-packages
# instead of the module in this checkout, so the suite can pass (or fail)
# against code that is not in the tree.
pythonpath = ["."]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "ANN", "ASYNC", "S", "B", "A", "C4", "DTZ",
  "T20", "PT", "RET", "SIM", "PTH", "ERA", "TD", "FIX", "PLR2004", "TRY", "PL", "RUF",
]
ignore = [
  "ANN401",      # Any in *args/**kwargs — FC-GEN-016's comment rule covers it
  "TRY003",      # long messages inline; FC-GEN-022 wants them descriptive
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
# `assert` is what a test is, and an expected value is the literal it compares
# against -- naming it moves the assertion one step from the thing asserted.
"tests/**" = [
  "S101",     # `assert` is what a test is
  "PLR2004",  # an expected value is the literal it compares against
  "ANN001",   # a fixture or a fake's argument, named by the test that builds it
  "ANN202",   # ditto a fake's return: it is whatever the code under test reads
]
