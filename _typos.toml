# typos runs in code-quality.yml. This is the one exclusion the fleet needs.
#
# CHANGELOG.md is generated by release-please and every entry carries the commit
# SHA twice — once as link text, once in the URL. A hex string is a rich source
# of accidental words: `080ba2e` contains `ba`, which typos reports as "should
# be `by`, `be`" and fails the build. The file holds no hand-written prose, so
# there is nothing in it worth spellchecking.
#
# The SHA *pins* in workflows and .pre-commit-config.yaml are fine as-is: every
# repo in the fleet has them and only the ones with changelog links ever failed.
# `reports/` holds generated tool output (gandalf, scanners) — JSON full of hex
# fingerprints, same problem, same reasoning.
[files]
extend-exclude = ["CHANGELOG.md", "reports/"]

# Domain vocabulary the dictionary reads as misspellings. Each of these is a
# real term in this portfolio (GreenOps, SRE, security), not a typo, and the
# alternative is 50 per-repo config files saying the same thing.
[default.extend-words]
RTO = "RTO"        # Recovery Time Objective
RPO = "RPO"        # Recovery Point Objective
moer = "moer"      # Marginal Operating Emissions Rate (WattTime signal)
BA = "BA"          # Balancing Authority (electricity grid)
entsoe = "entsoe"  # ENTSO-E, the European TSO network
wrk = "wrk"        # the HTTP benchmarking tool
criticals = "criticals"  # security jargon: findings of critical severity
