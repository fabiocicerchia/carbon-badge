# CircleCI — refresh the badge nightly and keep it as a build artifact.
# Copy into .circleci/config.yml.
#
# Add the schedule under Project Settings -> Triggers -> Scheduled pipelines;
# the `when:` below is what keeps this workflow off every push.
version: 2.1

jobs:
  carbon-badge:
    docker:
      - image: cimg/python:3.13
    steps:
      - run:
          name: Install
          command: pip install --no-cache-dir "git+https://github.com/fabiocicerchia/carbon-badge@v0.2.1"
      - run:
          name: Refresh the badge
          # GITHUB_TOKEN: a PAT with actions:read on the target repo, set as a
          # project environment variable. Off GitHub there is no built-in token.
          command: |
            mkdir -p /tmp/badge
            carbon-badge "$TARGET_REPO" --grid-intensity 56 > /tmp/badge/badge.json
            cat /tmp/badge/badge.json
      - store_artifacts:
          path: /tmp/badge

workflows:
  nightly:
    when:
      equal: [scheduled_pipeline, << pipeline.trigger_source >>]
    jobs:
      - carbon-badge

# CircleCI artifacts are behind auth on private projects, so for a README badge
# push badge.json somewhere public instead — an S3 bucket, a gh-pages branch,
# or any static host. shields.io has to be able to fetch it.
