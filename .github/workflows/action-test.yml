name: action-test

on:
  push:
    branches: [main]
    paths: [action.yml, ".github/workflows/action-test.yml"]
  pull_request:
    paths: [action.yml, ".github/workflows/action-test.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - id: badge
        uses: ./
        with:
          minutes: "600"
          publish-branch: ""
      - name: check outputs
        env:
          MESSAGE: ${{ steps.badge.outputs.message }}
          COLOR: ${{ steps.badge.outputs.color }}
        run: |
          [[ "$MESSAGE" == *"CO2e/mo" ]] || { echo "unexpected message: $MESSAGE"; exit 1; }
          [[ -n "$COLOR" ]] || { echo "missing color output"; exit 1; }
          echo "ok: $MESSAGE ($COLOR)"
