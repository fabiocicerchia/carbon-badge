name: code-quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Lint the GitHub Actions workflows themselves.
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2.2.0

      # Enforce .editorconfig (indentation, EOL, trailing whitespace).
      - name: editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@d2ed4fd072ae6f887e9407c909af0f585d2ad9f4  # v2
        with:
          # The action is pinned but the tool it downloads was not: it
          # resolved `latest`, and editorconfig-checker v4.0.0 renamed its
          # release assets from ec-* to editorconfig-checker-*. The action
          # looks for `ec-linux-amd64*`, so every run started failing with
          # "The binary 'ec-linux-amd64*' not found". v4 is a deliberate
          # bump, not something a release should make for us.
          version: v3.11.3

      # The action above only downloads the binary and adds it to PATH;
      # without this step nothing is ever checked.
      - name: editorconfig
        run: editorconfig-checker

      # Catch common typos in code and docs.
      - name: typos
        uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b  # master

      # pre-commit runs the language-specific hooks defined in
      # .pre-commit-config.yaml. It no-ops gracefully if none apply.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.x"
      - name: pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1
