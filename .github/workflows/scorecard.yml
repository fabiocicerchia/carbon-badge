name: scorecard

# OpenSSF Scorecard: rates the repo's security posture (branch protection,
# pinned deps, token permissions, etc.) and uploads results to the Security tab.
# Public repos: results also appear at deps.dev / the Scorecard badge.

on:
  branch_protection_rule:
  schedule:
    - cron: "0 6 * * 1" # weekly
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF
      id-token: write # publish results (public repos)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4.37.0
        with:
          sarif_file: results.sarif
