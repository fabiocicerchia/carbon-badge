name: release

# release-please reads Conventional Commit messages on main and keeps an open
# "release PR" with the next version bump (pyproject.toml + CHANGELOG.md).
# Merging that PR tags the release (vX.Y.Z) and publishes a GitHub Release;
# the build/publish jobs below then run on that same push and attach artifacts.
#
# Requires: Settings > Actions > "Allow GitHub Actions to create and approve
# pull requests" enabled. PyPI publishing is opt-in: configure a Trusted
# Publisher (workflow: release.yml, environment: pypi) on pypi.org and set the
# repository variable PUBLISH_TO_PYPI to "true".
#
# Why this is two release-please jobs and not one — do not collapse them back:
# a draft release has no git tag, publishing it is what creates the tag. A
# single invocation cuts the release and then computes the next release PR in
# the same run, while the release is still a draft — so there is no tag for the
# version already in .release-please-manifest.json, release-please loses its
# anchor, walks the entire history and opens a PR re-releasing everything.
# Merging that cuts another release, which opens another PR, forever. So:
#
#   release-please  phase 1 — cut the draft release only
#   attach-assets   attach assets, publish the draft -> the tag now exists
#   release-pr      phase 2 — open/update the next release PR only

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    permissions:
      contents: write # create tags & releases
      pull-requests: write # open/update the release PR
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          # Bumps `version` in pyproject.toml and maintains CHANGELOG.md.
          # Manifest mode: release-please-config.json sets `draft: true` so the
          # GitHub Release is created unpublished. Immutable releases reject asset
          # uploads once a release is published, so assets must land while it is
          # still a draft; a later step flips it to published.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install --require-hashes -r requirements-release.txt
          python -m build
      - name: Check metadata
        run: twine check dist/*  # installed from the hashed lock above
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  attach-assets:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Attach sdist + wheel to the release
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}

      - name: Publish the draft release
        # Assets can only be attached while the release is a draft;
        # publishing last is what leaves it immutable with assets intact.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.release-please.outputs.tag_name }}" --draft=false --repo "$GITHUB_REPOSITORY"
  pypi:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true' && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  # Building the image has to hang off this job rather than off the release
  # event: the release release-please publishes carries GITHUB_TOKEN, and
  # GitHub does not start workflows from GITHUB_TOKEN events. Called in the
  # same run, it just works — no PAT to mint, rotate, or leak.
  publish:
    # After `attach-assets`: this checks out the tag, and a
    # draft release has no tag until it is published.
    needs: [release-please, attach-assets]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  # Phase 2 — open/update the next release PR, now that `attach-assets` has
  # published the draft and the tag exists. `always()` because on an
  # ordinary push no release was cut and `attach-assets` is skipped, yet the
  # release PR still has to be kept up to date; when a release *was* cut,
  # `attach-assets` must have succeeded, or there is no tag to anchor on and
  # this would re-release the whole history.
  release-pr:
    needs: [release-please, attach-assets]
    if: always()
      && needs.release-please.result == 'success'
      && (needs.release-please.outputs.release_created != 'true'
      || needs.attach-assets.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write # open/update the release PR
    steps:
      # Same configuration as phase 1 — the two invocations must agree.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
