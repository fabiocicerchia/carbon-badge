name: Publish Image

# Builds and pushes the multi-arch image to GHCR whenever a GitHub Release is
# published — by release-please or manually.

on:
  # A release published by release-please runs under GITHUB_TOKEN, and GitHub
  # deliberately does not fire workflows from GITHUB_TOKEN events — so this
  # trigger alone never ran. release.yml now calls this workflow directly via
  # workflow_call; the release trigger stays for releases cut by a human.
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Release tag to build.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (e.g. v1.0.0).
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version (strip leading v)
        id: ver
        env:
          TAG_NAME: ${{ inputs.tag || github.event.release.tag_name }}
        run: echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
