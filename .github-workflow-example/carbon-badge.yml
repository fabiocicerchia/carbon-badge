# Copy into .github/workflows/ of the target repo: refreshes the badge nightly
# and publishes badge.json to the gh-pages branch.
name: carbon-badge
on:
  schedule: [{ cron: "17 2 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: pipx install "git+https://github.com/fabiocicerchia/carbon-badge"
      - run: carbon-badge ${{ github.repository }} > badge.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: publish to gh-pages
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -B gh-pages
          git add badge.json
          git commit -m "refresh carbon badge"
          git push -f origin gh-pages
